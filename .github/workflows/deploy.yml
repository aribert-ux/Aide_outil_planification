name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer config.js depuis les secrets
        run: |
          cat > config.js << 'EOF'
          window.APP_CONFIG = {
            LITELLM_API_KEY:  "${{ secrets.LITELLM_API_KEY }}",
            LITELLM_API_BASE: "${{ secrets.LITELLM_API_BASE }}",
            LITELLM_MODEL:    "${{ secrets.LITELLM_MODEL }}",
            GITHUB_RAW_URL:   "https://raw.githubusercontent.com/aribert-ux/Output/main/index.html"
          };
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,*.yml,*.yaml'
